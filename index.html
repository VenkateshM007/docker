<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rainbow Connect</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg,
                #ff0000, #ff9900, #ffff00,
                #00cc00, #0099ff, #6633ff);
            background-size: 400% 400%;
            animation: rainbow 10s ease infinite;
            color: white;
            text-align: center;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            margin-top: 15%;
            padding: 20px;
        }

        h1 {
            font-size: 3em;
        }

        p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .btn {
            background: white;
            color: black;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #000;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌈 Rainbow Connect</h1>
    <p>A safe and inclusive space for everyone to connect, share, and support each other.</p>
    <button class="btn">Join Community</button>
</div>

</body>
</html>
